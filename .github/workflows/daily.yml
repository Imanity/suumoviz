name: Daily crawl

on:
  schedule:
    - cron: "17 18 * * *" # 03:17 JST (UTC+9); avoid :00 when GitHub delays schedules
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Fetch at most N list pages (leave empty for the full slot)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # push to the data branch
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch into ./data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install .

      - name: Crawl today's slot and merge
        id: daily
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set +e
          args=()
          if [ -n "$MAX_PAGES" ]; then args+=(--max-pages "$MAX_PAGES"); fi
          suumoviz daily "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Always commit: a block writes the cooldown into data/state.json.
      - name: Commit data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          summary=$(python - <<'EOF'
          import json
          r = json.load(open("state.json")).get("last_run") or {}
          print(r.get("date"), r.get("status"), f"requests={r.get('requests')}", f"listings={r.get('listings')}")
          EOF
          )
          git commit -q -m "data: $summary"
          git push origin HEAD:data

      # work/ tables are obfuscated like data/ (run.json holds counts only)
      - name: Keep the day snapshot for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: work/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail the job when the crawl or merge had problems
        if: steps.daily.outputs.code != '0'
        run: |
          echo "suumoviz daily exited with ${{ steps.daily.outputs.code }} (1 = partial/quality, 2 = blocked)"
          exit 1

  # Rebuild the page even after a skipped or failed crawl (the data branch is unchanged then).
  pages:
    needs: crawl
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
