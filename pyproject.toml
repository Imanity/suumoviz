[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suumoviz"
version = "0.1.0"
description = "Daily rotating crawl of SUUMO Tokyo for-sale list pages, with map visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["lxml>=5.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
suumoviz = "suumoviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suumoviz = ["geodata/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
